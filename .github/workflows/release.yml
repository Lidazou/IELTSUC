name: Build and publish Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run portable
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version=(Get-Content package.json | ConvertFrom-Json).version
          $exe="dist/IELTSUC-$version-win-x64.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  IELTSUC-$version-win-x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          gh release view "v$version" --repo $env:GH_REPO *> $null
          if($LASTEXITCODE -ne 0){ gh release create "v$version" --repo $env:GH_REPO --target $env:GITHUB_SHA --title "IELTSUC $version Windows" --notes-file docs/RELEASE.md }
          gh release upload "v$version" --repo $env:GH_REPO $exe dist/SHA256SUMS.txt docs/DEPLOYMENT.md docs/VOCABULARY.md docs/OLLAMA.md THIRD_PARTY_NOTICES.md --clobber
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
